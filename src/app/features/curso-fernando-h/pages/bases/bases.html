<div>
  <app-page-breadcrumb pageTitle="Bases" />
  <div class="grid grid-cols-1 gap-6 xl:grid-cols-2">
    <!-- Counter -->
    <div class="space-y-6">
      <app-component-card title="Counter">
        <h1>Counter: {{ counter }}</h1>
        <h1>Counter Signal: {{ counterSignal() }}</h1>
        <hr />
        <div class="col-start-1 col-end-5 flex">
          <ui-button size="sm" class="mr-2" variant="outline" (click)="increaseBy(1)"
            >Increment + 1</ui-button
          >
          <ui-button size="sm" class="mr-2" variant="outline" (click)="increaseBy(-1)"
            >Decrement - 1</ui-button
          >
          <ui-button size="sm" class="mr-2" variant="outline" (click)="resetCounter()"
            >Reset</ui-button
          >
        </div>
      </app-component-card>
    </div>
    <!-- Dragon Ball -->
    <div class="space-y-6">
      <app-component-card title="Dragon Ball">
        <div class="grid grid-cols-2">
          <div class="mr-2">
            <app-character-add (newCharacter)="dragonballService.addCharacter($event)" />
          </div>

          <div class="ml-2">
            <app-character-list
              listName="Listado de personajes"
              [characters]="dragonballService.characters()"
            />
          </div>
        </div>
      </app-component-card>
    </div>
    <!-- Hero -->
    <div class="space-y-6">
      <app-component-card title="Dragon Ball">
        <h1>{{ name() }}</h1>

        <dl class="mb-4">
          <td>Nombre:</td>
          <dd>{{ name() }}</dd>

          <td>Edad:</td>
          <dd>{{ age() }}</dd>

          <td>Método:</td>
          <dd>{{ heroDescription() }}</dd>

          <td>Capitalizado:</td>
          <dd>{{ capitalizedName() }}</dd>
          <!-- <dd>{{ name() | uppercase }}</dd> -->
        </dl>
        <ui-button size="sm" class="mr-2" variant="outline" (click)="changeHero()">Cambiar nombre</ui-button>
        <ui-button size="sm" class="mr-2" variant="outline" (click)="changeAge()">Cambiar edad</ui-button>
        <ui-button size="sm" class="mr-2" variant="outline" (click)="resetForm()">Reset</ui-button>
      </app-component-card>
    </div>
  </div>
</div>
